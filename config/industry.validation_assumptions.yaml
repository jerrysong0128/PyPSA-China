# Engineering validation only. These values are NOT a calibrated steel scenario.
# Do not use route shares, costs, emissions or dispatch as scientific findings.
year: 2030
currency: PIK_effective_EUR_unverified_price_year
status: engineering_validation_only
discount_rate: 0.06
new_capacity_multiple_of_demand: 2.0
resource_capacity_multiple_of_demand: 2.0
scrap_fraction_of_crude_demand: 0.30
inventory_days: 0.0
inventory_annual_cost_per_t: 20.0
missing_production_policy: explicit_zero_scenario
baseline_route_share: GEM2026_EAF_share_of_BOF_plus_EAF_capacity
resource_prices:
  ore: 100.0
  scrap: 300.0
  coal: 10.0
  gas: 30.0
assumptions:
  money: All resource prices and route CAPEX are independent test assumptions in the inherited PIK numerical EUR convention; no currency conversion or common price year is claimed.
  temporal: Hold NBS2020 provincial production constant as 2030 local product demand; no final-demand or trade inference.
  baseline: Estimate 2020 route output shares from GEM2026 capacity; estimate gross baseline electricity and direct CO2 using the same simplified route coefficients. Neither quantity is an observation.
  sector: Transfer Henan2024 sector shares to every province; unobserved other-ferrous residual remains in other-industry.
  flexibility: Minimum load, ramps, capacity additions, resource bounds, scrap fraction and inventory costs are explicitly selected test conditions, not empirical estimates.
  fuels: Simplified fuel combustion accounting; BF byproduct recovery is not explicit. EAF/DRI minor electrode and fuel inputs are omitted, so their zero direct CO2 is a simplification, not a claim of zero plant emissions.
